<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('tv_theme') || 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var active = saved === 'system' ? (prefersDark ? 'dark' : 'light') : saved;
          document.documentElement.setAttribute('data-theme', active);
          document.documentElement.classList.add('theme-' + active);
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#0a0c10" />
    <meta name="description" content="TrustVault — Secure Document Management Platform with AES-256-GCM encryption, granular role-based permissions, and tamper-evident audit logs." />
    
    <!-- Google Fonts: Space Grotesk, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <title>TrustVault Enterprise — Secure Document Vault</title>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-500/20 selection:text-indigo-900">

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
